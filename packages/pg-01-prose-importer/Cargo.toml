[package]
name = "pg-01-prose-importer"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Streaming FB2, DOCX and TXT import into rich narrative blocks"

[dependencies]
quick-xml = { version = "=0.38.3", features = ["encoding"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[[bench]]
name = "import_200k"
harness = false

[package]
name = "pg-02-screenplay-importer"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
description = "Text-layer PDF screenplay importer with positional provenance and doubt reports"

[dependencies]
hayro-interpret = "0.7"
kurbo = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "pg-05-breakdown-export"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Neutral production breakdown JSON to tagged FDX and supplied-order CSV"
repository = "https://github.com/stanlauck/divo-playground"
readme = "README.md"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
csv = "=1.4.0"
uuid = { version = "=1.24.0", features = ["v5"] }

[dev-dependencies]
roxmltree = "=0.21.1"

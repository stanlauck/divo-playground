[package]
name = "gltf-mockup"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Neutral shot JSON -> glTF 2.0 scene mock-up with camera markers and placeholder props"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
base64 = "0.22"
gltf = { version = "1", default-features = false, features = ["utils", "names", "extras"] }

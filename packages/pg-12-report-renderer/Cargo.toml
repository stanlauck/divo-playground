[package]
name = "report-renderer"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false
description = "Bounded neutral report JSON to Markdown, Typst, and optional PDF"
readme = "README.md"
repository = "https://github.com/stanlauck/divo-playground"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

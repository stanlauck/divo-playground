[package]
name = "subtitle-writer"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Neutral dialogue timing JSON to SRT / WebVTT / TTML with readability checks"
readme = "README.md"
repository = "https://github.com/stanlauck/divo-playground"
publish = false

[lib]
name = "subtitle_writer"
path = "src/lib.rs"

[[bin]]
name = "subtitle-writer"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

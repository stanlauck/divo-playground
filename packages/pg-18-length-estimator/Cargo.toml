[package]
name = "screenplay-length"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Deterministic per-scene screenplay length estimator (Fountain text to eighths of a page)"
readme = "README.md"
repository = "https://github.com/stanlauck/divo-playground"
publish = false

[lib]
name = "screenplay_length"
path = "src/lib.rs"

[[bin]]
name = "screenplay-length"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[package]
name = "ink-reader"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/stanlauck/divo-playground"
description = "Bounded compiled Ink runtime JSON to neutral dialogue graph"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }

[[bin]]
name = "ink2graph"
path = "src/main.rs"

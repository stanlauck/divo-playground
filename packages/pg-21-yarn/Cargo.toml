# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "pg-21-yarn"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Yarn Spinner 2 .yarn parser to neutral dialogue-graph JSON with line ids and a finding report"
repository = "https://github.com/stanlauck/divo-playground"
readme = "README.md"
publish = false

[lib]
name = "pg_21_yarn"
path = "src/lib.rs"

[[bin]]
name = "yarn2graph"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
